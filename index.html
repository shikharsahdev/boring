<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boring</title>
  <link rel="icon" type="image/svg+xml" href="design-system/assets/little-b/little-b-daylight.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Nunito+Sans:wght@700;800&display=swap">
  <link rel="stylesheet" href="design-system/tokens/happy-longevity/boring.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--boring-color-surface-page, #FFFBF2);
      color: var(--boring-color-text-primary, #294968);
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.5;
    }
    main { max-width: 760px; margin: 0 auto; padding: 72px 24px 96px; }
    .wordmark { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; }
    .wordmark img { width: 52px; height: auto; }
    .wordmark span { font: 800 40px/1 "Nunito Sans", system-ui, sans-serif; letter-spacing: -0.02em; }
    h1 { font: 700 clamp(30px, 5vw, 44px)/1.1 "Nunito Sans", system-ui, sans-serif; margin: 0 0 12px; }
    .lede { color: var(--boring-color-text-secondary, #4F6A82); margin: 0 0 40px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; }
    a.card {
      display: block;
      padding: 24px;
      border: 1px solid var(--boring-color-border-subtle, #E6DECB);
      border-radius: var(--boring-radius-card, 18px);
      background: var(--boring-color-surface-card, #fff);
      color: inherit;
      text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    a.card:hover { border-color: var(--boring-color-border-focus, #294968); transform: translateY(-1px); }
    a.card:focus-visible { outline: 3px solid var(--boring-color-border-focus, #294968); outline-offset: 2px; }
    a.card strong { display: block; font: 700 21px/1.3 "Nunito Sans", system-ui, sans-serif; margin-bottom: 4px; }
    a.card span { color: var(--boring-color-text-secondary, #4F6A82); }
    .sub { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 15px; }
    .sub a { color: var(--boring-color-text-link, #294968); }
    h2 { font: 700 15px/1 "DM Sans", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--boring-color-text-secondary, #4F6A82); margin: 0 0 16px; }
    @media (prefers-reduced-motion: reduce) { a.card { transition: none; } a.card:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <div class="wordmark">
      <img src="design-system/assets/little-b/little-b-daylight.svg" alt="">
      <span>boring</span>
    </div>
    <h1>Everything we're building.</h1>
    <p class="lede">The design system, website, and prototypes for Boring.</p>

    <h2>Projects</h2>
    <ul>
      <!-- Add a new <li> here for each new top-level project folder. -->
      <li>
        <a class="card" href="design-system/">
          <strong>Design system</strong>
          <span>Brand, tokens, components, the marketing site, and the family app preview.</span>
        </a>
        <div class="sub">
          <a href="design-system/library/">Design library</a>
          <a href="design-system/ui_kits/app/">Family app preview</a>
          <a href="design-system/ui_kits/site/">Site UI kit</a>
          <a href="design-system/explorations/happy-longevity.html">Happy longevity exploration</a>
        </div>
      </li>
    </ul>
  </main>
</body>
</html>
